<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Original paintings — opening soon</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f2ec; color: #22201c;
         font-family: Georgia, "Times New Roman", serif; text-align: center; padding: 24px; box-sizing: border-box; }
  .frame { width: 140px; height: 175px; margin: 0 auto 32px; background: linear-gradient(160deg, #c96f4a, #e9c46a 55%, #2a6f6b);
           box-shadow: 0 0 0 10px #fff, 0 18px 40px rgba(0,0,0,.18); }
  h1 { font-weight: 500; font-size: clamp(30px, 6vw, 48px); margin: 0 0 12px; }
  p { color: #6b645b; font: 16px/1.6 system-ui, sans-serif; margin: 0; }
</style>
</head>
<body>
  <main>
    <div class="frame" aria-hidden="true"></div>
    <h1>Original paintings</h1>
    <p>The gallery is opening soon.</p>
  </main>
</body>
</html>
